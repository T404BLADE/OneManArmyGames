<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneManArmyGames</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Контейнер для картинки — по центру по горизонтали, прижата к верху */
        .header-image {
            text-align: center;
            padding-top: 0;
            margin-top: 0;
        }

        .header-image img {
            max-width: 80%;
            height: auto;
            display: inline-block;
        }

        /* Заголовок под картинкой — тоже по центру */
        .title {
            text-align: center;
            margin-top: 20px;
        }

        .title h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Если нужен подзаголовок */
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-top: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="header-image">
        <img src="Images/Logo.png" alt="OneManArmyGames">
    </div>
    
    <div class="title">
        <h1>OneManArmyGames</h1>
    </div>
    
    <!-- Если нужен подзаголовок, раскомментируйте -->
    <!-- <div class="subtitle">Ваш слоган или описание</div> -->
</body>
</html>
